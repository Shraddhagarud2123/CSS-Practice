<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Styles</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;S
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #1e293b;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .primary {
      background: #2563eb;
      color: white;
      border: 2px solid #2563eb;
    }
    .primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }
    .secondary {
      background: #64748b;
      color: white;
      border: 2px solid #64748b;
    }

    .secondary:hover {
      background: #475569;
      border-color: #475569;
    }
    .success {
      background: #16a34a;
      color: white;
      border: 2px solid #16a34a;
    }

    .success:hover {
      background: #15803d;
      border-color: #15803d;
    }
    .danger {
      background: #dc2626;
      color: white;
      border: 2px solid #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
      border-color: #b91c1c;
    }
    .outline {
      background: transparent;
      color: #2563eb;
      border: 2px solid #2563eb;
    }

    .outline:hover {
      background: #2563eb;
      color: white;
    }
    .ghost {
      background: transparent;
      color: #334155;
      border: 2px solid transparent;
    }

    .ghost:hover {
      background: #e2e8f0;
    }
    .gradient {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: white;
      border: 2px solid transparent;
    }
    .gradient:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Different Button Styles</h1>

    <div class="buttons">
      <button class="btn primary">Primary</button>
      <button class="btn secondary">Secondary</button>
      <button class="btn success">Success</button>
      <button class="btn danger">Danger</button>
      <button class="btn outline">Outline</button>
      <button class="btn ghost">Ghost</button>
      <button class="btn gradient">Gradient</button>
    </div>
  </div>

</body>
</html>
