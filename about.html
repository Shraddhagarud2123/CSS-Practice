<!DOCTYPE html>
<html>
<head>
    <title>CSS Three Ways</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            width: 60%;
            border-radius: 10px;
        }
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">
        <h1 style="color: purple; font-size: 35px;">
            Welcome to My Webpage
        </h1>

        <p>
            This webpage demonstrates three ways of applying CSS.
        </p>

        <h2>Three Ways of CSS</h2>

        <p class="external-text">
            1. Inline CSS<br>
            2. Internal / Document Level CSS<br>
            3. External CSS
        </p>

        <button>Learn CSS</button>

    </div>

</body>
</html>
